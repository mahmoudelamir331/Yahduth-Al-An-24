name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  main-site:
    name: Main site lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install main site dependencies
        run: npm ci
      - name: Lint main site
        run: npm run lint
      - name: Test main site
        run: npm test
      - name: Build main site
        run: npm run build
